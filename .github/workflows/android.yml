# Builds the Android version and puts Personafy.apk into the "android" branch
# (one commit, replaced every time — like the Windows installer in "installer" and the iPhone app in "ios").
# The .apk is signed with mobile/android/personafy.keystore, so every new build installs over the old one.
# If the build fails, its log is attached to the run as "build-log".
# Then the app is checked on Android emulators (scripts/android-check.mjs): music from Google Drive, the
# notification player, screen off, back button, screenshots of the three themes. The result is shown on the
# run's summary page; screenshots and logs are attached to the run as "check-app" and "check-themes".
# Runs only when asked: a tag "android-<anything>" (e.g. android-1.5.0), or "Run workflow" on the Actions page.
name: Android build

on:
  push:
    tags: ['android-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK parts
        run: |
          set -o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3 | tee -a mobile/steps.log

      - name: Install Capacitor
        working-directory: mobile
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a steps.log

      - name: Web part (player interface + phone layer)
        working-directory: mobile
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee -a steps.log
          npx cap sync android 2>&1 | tee -a steps.log

      - name: Build the app
        working-directory: mobile/android
        env:
          PERSONAFY_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug 2>&1 | tee ../build.log | grep -E "error:|warning:|FAILURE|BUILD (SUCCESSFUL|FAILED)|What went wrong" || true
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Check the signature
        working-directory: mobile/android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee -a ../steps.log
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -3 | tee -a ../steps.log
          ls -lh app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish to the "android" branch
        working-directory: mobile
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir pub && cp android/app/build/outputs/apk/release/app-release.apk pub/Personafy.apk
          cp android-branch-README.md pub/README.md
          printf 'Personafy %s для Android\nсборка %s от %s\nкоммит %s\n' "$VERSION" "${{ github.run_number }}" "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_SHA}" > pub/build.txt
          cd pub
          git init -q -b android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Personafy $VERSION для Android (сборка ${{ github.run_number }})"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android
          echo "### Готово: Personafy.apk в ветке android (сборка ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the log of a failed build
        if: failure()
        working-directory: mobile
        run: |
          mkdir -p logpub
          if [ -f build.log ]; then
            grep -nE "error:|e: |FAILURE|What went wrong|Exception" build.log | head -200 > logpub/errors.txt || true
            tail -n 3000 build.log > logpub/build-tail.log
          else
            echo "no build.log — the failure happened before gradle" > logpub/errors.txt
          fi
          [ -f steps.log ] && tail -n 400 steps.log > logpub/steps.log || true
          printf 'run %s, commit %s\n' "${{ github.run_number }}" "${GITHUB_SHA}" > logpub/run.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: mobile/logpub
          retention-days: 30

  check:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # music, notification, headphone buttons, screen off, back button
          - part: app
            gpu: swiftshader_indirect
          # photos of the three themes (drawn inside the emulator: the host renderer crashed on the P3R theme)
          - part: themes
            gpu: guest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Let the emulator use the processor directly (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHECK: ${{ matrix.part }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -no-boot-anim -camera-back none
          script: node mobile/scripts/android-check.mjs check-${{ matrix.part }} "$(find apks -name app-release.apk | head -1)" "$(find apks -name app-debug.apk | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.part }}
          path: check-${{ matrix.part }}
          retention-days: 30

  summary:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: check-*
          path: check

      - name: Show the check on the run's page
        run: |
          for part in app themes; do
            if [ -f "check/check-$part/result.md" ]; then cat "check/check-$part/result.md"; else echo "# $part: the check did not run"; fi
            echo
          done >> "$GITHUB_STEP_SUMMARY"
